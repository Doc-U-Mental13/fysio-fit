var BASIS=[
E('squat','Squat (lichaamsgewicht)','kracht','benen',[],['knie'],'Voeten schouderbreed, zit naar achteren alsof je op een stoel gaat zitten, rug recht, knieën boven de voeten.'),
E('gobletsquat','Goblet squat met halter','kracht','benen',['halters'],['knie','onderrug'],'Houd een halter tegen de borst en zak door de knieën met rechte rug.'),
E('lunge','Achterwaartse uitvalspas','kracht','benen',[],['knie','enkel','heup'],'Stap met één been naar achter en zak recht naar beneden, wissel van been.'),
E('stepup','Step-ups op de trap','kracht','benen',['trap'],['knie','enkel','heup'],'Stap op een trede, duw jezelf volledig recht, stap terug en wissel van been.'),
E('rdl','Roemeense deadlift met halters','kracht','bil',['halters'],['onderrug'],'Heupen naar achter schuiven met licht gebogen knieën en rechte rug, halters langs de benen.'),
E('bilbrug','Bilbrug','kracht','bil',[],[],'Lig op je rug, knieën gebogen, duw de heupen omhoog en span de billen aan.'),
E('clamshell','Clamshell (zijlig heupopening)','kracht','bil',[],['heup'],'Lig op je zij met gebogen knieën en open de bovenste knie zonder dat de heupen kantelen.'),
E('kuit','Kuitheffen','kracht','kuiten',[],['enkel'],'Sta rechtop, kom langzaam op de tenen en zak weer gecontroleerd. Houd je vast aan een stoel.'),
E('floorpress','Vloerpress met halters','kracht','borst',['halters'],['schouder','elleboog','pols'],'Lig op de vloer en duw de halters recht omhoog boven de borst.'),
E('opdrukwand','Opdrukken tegen de muur','kracht','borst',[],['schouder','pols'],'Handen op borsthoogte tegen de muur, buig de ellebogen en duw weer weg.'),
E('roei','Voorovergebogen roeien met halters','kracht','rug',['halters'],['onderrug'],'Buig vanuit de heupen met rechte rug en trek de halters naar de buik.'),
E('roei1','Eenarmig roeien met halter (steun op stoel)','kracht','rug',['halters'],['schouder'],'Eén hand op een stoel, trek met de andere arm de halter naar de heup.'),
E('press','Schouderpress met halters','kracht','schouders',['halters'],['schouder','nek'],'Duw de halters van schouderhoogte recht omhoog en zak gecontroleerd.'),
E('zijwaarts','Zijwaarts heffen met halters','kracht','schouders',['halters'],['schouder'],'Til de armen met lichte halters zijwaarts tot schouderhoogte.'),
E('shrug','Schouderophalen met halters','kracht','schouders',['halters'],['nek'],'Trek de schouders recht omhoog richting de oren en laat langzaam zakken.'),
E('curl','Biceps curl met halters','kracht','biceps',['halters'],['elleboog','pols'],'Ellebogen langs het lichaam, buig de armen tot de halters bij de schouders komen.'),
E('hamer','Hamer curl met halters','kracht','biceps',['halters'],['elleboog','pols'],'Zoals een curl maar met de handpalmen naar elkaar gericht.'),
E('triover','Triceps extensie boven het hoofd','kracht','triceps',['halters'],['schouder','elleboog'],'Houd één halter met twee handen boven het hoofd en buig en strek de ellebogen.'),
E('kick','Triceps kickback','kracht','triceps',['halters'],['elleboog','onderrug'],'Voorovergebogen, elleboog bij het lichaam, strek de onderarm naar achter.'),
E('plank','Plank (op de knieën of de tenen)','kracht','core',[],['schouder','pols','onderrug'],'Steun op de onderarmen, lichaam in een rechte lijn en houd de spanning vast.',{tijd:true}),
E('deadbug','Dead bug','kracht','core',[],[],'Lig op je rug, arm en tegenovergesteld been strekken afwisselend naar buiten met de onderrug op de grond.'),
E('crunch','Crunch','kracht','core',[],['nek','onderrug'],'Lig op je rug met gebogen knieën en kom met de schouderbladen een stukje van de grond.'),
E('birddog','Bird dog','kracht','core',[],['pols','knie'],'Op handen en knieën, strek tegelijk een arm en het tegenovergestelde been naar voren en achter.'),
E('russian','Russian twist','kracht','core',[],['onderrug'],'Zittend, licht achterover, draai de romp links en rechts, eventueel met een halter.'),
E('loop_wandel','Wandelen op de loopband','cardio','cardio',['loopband'],[],'Vlot doorstappen aan een tempo waarbij je nog kan praten.'),
E('loop_helling','Wandelen met helling op de loopband','cardio','cardio',['loopband'],['knie','enkel'],'Zet de helling op 4 tot 8 procent en stap in een rustig tempo door.'),
E('loop_interval','Intervallen op de loopband','cardio','cardio',['loopband'],['knie','enkel','heup','onderrug'],'5 min opwarmen, daarna afwisselend 1 min stevig en 2 min rustig, en 5 min uitlopen.'),
E('fiets_duur','Rustig fietsen (duurtraining)','cardio','cardio',['fiets'],[],'Constant tempo waarbij je nog kan praten.'),
E('fiets_interval','Fietsen met intervallen','cardio','cardio',['fiets'],['knie'],'5 min opwarmen, daarna afwisselend 1 min zwaarder en 2 min rustig, en 5 min uitfietsen.'),
E('trap_cardio','Trap op en neer','cardio','cardio',['trap'],['knie','enkel','heup'],'Stap in een rustig tempo de trap op en neer. Houd de leuning vast.'),
E('wandel_buiten','Wandelen buiten','cardio','cardio',[],[],'Stevig doorstappen in de buurt, zonder materiaal.'),
E('s_quad','Quadriceps stretch (staand)','stretch','benen',[],['knie'],'Trek de hiel naar de bil en houd je vast aan een stoel.'),
E('s_ham','Hamstring stretch (zittend)','stretch','benen',[],[],'Zittend met één been gestrekt, leun voorover met rechte rug.'),
E('s_kuit','Kuitstretch tegen de muur','stretch','kuiten',[],[],'Eén voet achter, hiel op de grond, leun naar de muur.'),
E('s_heup','Heupbuiger stretch','stretch','bil',[],['knie'],'Halve knielende houding, schuif de heup naar voren.'),
E('s_bil','Bilspier stretch (liggend)','stretch','bil',[],['heup','knie'],'Lig op je rug, enkel op de andere knie, trek het been naar je toe.'),
E('s_borst','Borststretch in een deuropening','stretch','borst',[],['schouder'],'Onderarm tegen de deurstijl en draai de borst voorzichtig weg.'),
E('s_kat','Kat-kameel (bovenrug)','stretch','rug',[],['pols','knie'],'Op handen en knieën, wissel rond en hol de rug.'),
E('s_kind','Kindhouding','stretch','rug',[],['knie'],'Zit op de hielen en strek de armen voor je uit op de grond.'),
E('s_schouder','Schouderstretch (arm over de borst)','stretch','schouders',[],['schouder'],'Trek één arm met de andere hand voorzichtig over de borst.'),
E('s_nek','Nekstretch zijwaarts','stretch','schouders',[],['nek'],'Oor richting de schouder, de andere schouder laten zakken.'),
E('s_tri','Triceps stretch','stretch','triceps',[],['schouder'],'Hand achter het hoofd tussen de schouderbladen, duw de elleboog zachtjes naar achter.'),
E('s_bi','Biceps stretch tegen de muur','stretch','biceps',[],['schouder','elleboog'],'Hand plat tegen de muur met gestrekte arm en draai het lichaam weg.'),
E('s_knie','Onderrug: knieën naar de borst','stretch','core',[],[],'Lig op de rug en trek beide knieën zacht naar de borst.'),
E('s_sfinx','Buikstretch (sfinx)','stretch','core',[],['onderrug'],'Lig op de buik en steun op de onderarmen met de borst omhoog.')
];

function standaard(){return{
 profiel:{naam:'Erwin',lengte:'',doelen:{conditie:true,afvallen:true,spieropbouw:true},jpDagen:[2,4],thuisAantal:3,thuisDagen:[],blessures:[],blessureNotitie:'',materiaal:{loopband:true,fiets:true,halters:true,trap:false},halter:{baar:1,aantal:2,schijven:''},aantalOef:6,cardioMin:30},
 seed:1,eigen:[],uit:[],metingen:[],trainingen:[],laatsteExport:''
};}
var S=laad();
function laad(){
 var s=null,d=standaard();
 try{s=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){}
 if(!s)return d;
 var sp=s.profiel||{};
 var p=Object.assign({},d.profiel,sp);
 p.doelen=Object.assign({},d.profiel.doelen,sp.doelen||{});
 p.materiaal=Object.assign({},d.profiel.materiaal,sp.materiaal||{});
 p.halter=Object.assign({},d.profiel.halter,sp.halter||{});
 var r=Object.assign({},d,s);r.profiel=p;
 return r;
}
var opslagOk=true;
function bewaar(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){opslagOk=false;}}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function num(s){var n=parseFloat(String(s==null?'':s).replace(',','.'));return isNaN(n)?null:n;}
function fmt(n){return(n==null||!isFinite(n))?'':String(Math.round(n*100)/100).replace('.',',');}
function p2(n){return n<10?'0'+n:''+n;}
function vandaag(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function nlDatum(iso){var a=String(iso).split('-');return a.length===3?a[2]+'/'+a[1]+'/'+a[0]:iso;}
function vandaagIdx(){return(new Date().getDay()+6)%7;}
function weekNr(){return Math.floor(Date.now()/(7*864e5));}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function alle(){return BASIS.concat(S.eigen);}
function exById(id){var l=alle();for(var i=0;i<l.length;i++)if(l[i].id===id)return l[i];return null;}
function toegestaan(e){
 var p=S.profiel;
 if(S.uit.indexOf(e.id)>=0)return false;
 for(var i=0;i<e.uit.length;i++)if(p.blessures.indexOf(e.uit[i])>=0)return false;
 for(var j=0;j<e.mat.length;j++)if(!p.materiaal[e.mat[j]])return false;
 return true;
}
function ster(e){return e.nieuw?' <b title="nieuwe oefening">*</b>':'';}

/* halters */
function parseSchijven(s){
 var res=[];
 String(s||'').split(/[;\n]+/).forEach(function(t){
  t=t.trim().replace(/,/g,'.');if(!t)return;
  var m=t.match(/^(\d+)\s*[x\u00d7]\s*(\d+(?:\.\d+)?)$/i);
  if(m)res.push({aantal:+m[1],kg:+m[2]});
  else if(!isNaN(parseFloat(t)))res.push({aantal:1,kg:parseFloat(t)});
 });
 return res;
}
function halterGewichten(){
 var h=S.profiel.halter,n=Math.max(1,parseInt(h.aantal,10)||1),sums=[0];
 parseSchijven(h.schijven).forEach(function(x){
  var c=Math.floor(x.aantal/n);
  for(var i=0;i<c;i++){
   var nieuw=sums.slice();
   sums.forEach(function(s){nieuw.push(Math.round((s+x.kg)*100)/100);});
   sums=nieuw.filter(function(v,ix,a){return a.indexOf(v)===ix;});
  }
 });
 var baar=num(h.baar)||0;
 return sums.map(function(s){return Math.round((s+baar)*100)/100;}).sort(function(a,b){return a-b;});
}

/* schema */
function kiesDagen(jp,n){
 var gekozen=[],bezet=jp.slice();
 for(var i=0;i<n;i++){
  var beste=-1,s1=-1,s2=99;
  for(var d=0;d<7;d++){
   if(bezet.indexOf(d)>=0)continue;
   var afst=7;bezet.forEach(function(b){afst=Math.min(afst,Math.abs(b-d),7-Math.abs(b-d));});
   var buren=(bezet.indexOf((d+6)%7)>=0?1:0)+(bezet.indexOf((d+1)%7)>=0?1:0);
   if(afst>s1||(afst===s1&&buren<s2)){beste=d;s1=afst;s2=buren;}
  }
  if(beste<0)break;
  gekozen.push(beste);bezet.push(beste);
 }
 return gekozen.sort(function(a,b){return a-b;});
}
function pickRnd(arr,rng){return arr[Math.floor(rng()*arr.length)];}
function kiesStretch(rng,groepen){
 var pool=alle().filter(function(e){return e.type==='stretch'&&toegestaan(e);}),res=[];
 groepen.forEach(function(g){
  var o=pool.filter(function(e){return e.groep===g&&res.indexOf(e)<0;});
  if(o.length)res.push(pickRnd(o,rng));
 });
 return res.slice(0,6);
}
function warmup(){
 var m=S.profiel.materiaal;
 if(m.fiets)return '5 min rustig fietsen';
 if(m.loopband)return '5 min rustig wandelen op de loopband';
 return '5 min stappen ter plaatse met armbewegingen';
}
function maakKracht(rng,gebruikt){
 var p=S.profiel,n=parseInt(p.aantalOef,10)||6;
 var pool=alle().filter(function(e){return e.type==='kracht'&&toegestaan(e);});
 var per={};pool.forEach(function(e){(per[e.groep]=per[e.groep]||[]).push(e);});
 var groepen=Object.keys(per),kies=[],vorige=null;
 function vrij(g){return per[g].filter(function(e){return kies.indexOf(e)<0;});}
 function tel(g){return kies.filter(function(e){return e.groep===g;}).length;}
 for(var i=0;i<n;i++){
  var kand=groepen.filter(function(g){return vrij(g).length>0;});
  if(!kand.length)break;
  var a=kand.filter(function(g){return g!==vorige&&(!vorige||ZONE[g]!==ZONE[vorige]);});
  if(!a.length)a=kand.filter(function(g){return g!==vorige;});
  if(a.length)kand=a;
  var min=Math.min.apply(null,kand.map(tel));
  kand=kand.filter(function(g){return tel(g)===min;});
  var g=pickRnd(kand,rng),opt=vrij(g);
  var nieuw=opt.filter(function(e){return !gebruikt[e.id];});
  if(nieuw.length)opt=nieuw;
  var e=pickRnd(opt,rng);
  kies.push(e);gebruikt[e.id]=1;vorige=g;
 }
 var herh=p.doelen.spieropbouw?'8-12':'12-15';
 var oef=kies.map(function(e){return{ex:e,sets:3,herh:e.tijd?'30 s':herh};});
 var grp=[];kies.forEach(function(e){if(grp.indexOf(e.groep)<0)grp.push(e.groep);});
 return{type:'kracht',warmup:warmup(),oef:oef,stretch:kiesStretch(rng,grp)};
}
function maakCardio(rng,gebruikt){
 var pool=alle().filter(function(e){return e.type==='cardio'&&toegestaan(e);});
 var nieuw=pool.filter(function(e){return !gebruikt[e.id];});
 if(nieuw.length)pool=nieuw;
 var e=pickRnd(pool,rng);gebruikt[e.id]=1;
 return{type:'cardio',ex:e,minuten:S.profiel.cardioMin||30,stretch:kiesStretch(rng,['benen','kuiten','bil'])};
}
function plan(){
 var p=S.profiel,rng=mulberry32(S.seed*1000+weekNr()),jp=p.jpDagen.slice();
 var thuis=(p.thuisDagen&&p.thuisDagen.length)?p.thuisDagen.filter(function(d){return jp.indexOf(d)<0;}).sort(function(a,b){return a-b;}):kiesDagen(jp,parseInt(p.thuisAantal,10)||0);
 var eerstKracht=!!p.doelen.spieropbouw||thuis.length>1;
 var gk={},gc={},dagen=[];
 for(var d=0;d<7;d++){
  if(jp.indexOf(d)>=0)dagen.push({d:d,soort:'jp'});
  else if(thuis.indexOf(d)>=0){
   var i=thuis.indexOf(d),isKracht=((i%2===0)===eerstKracht);
   dagen.push({d:d,soort:'thuis',training:isKracht?maakKracht(rng,gk):maakCardio(rng,gc)});
  } else dagen.push({d:d,soort:'rust'});
 }
 return dagen;
}
function laatsteVoor(exId){
 var ts=S.trainingen.slice().sort(function(a,b){return a.datum<b.datum?1:-1;});
 for(var i=0;i<ts.length;i++){
  var its=ts[i].items||[];
  for(var j=0;j<its.length;j++)if(its[j].exId===exId&&its[j].sets&&its[j].sets.length){
   var b=besteSet(its[j].sets);if(b)return b;
  }
 }
 return null;
}
function besteSet(sets){
 var b=null;
 sets.forEach(function(s){
  if(s.kg==null&&s.reps==null)return;
  if(!b||(s.kg||0)>(b.kg||0)||((s.kg||0)===(b.kg||0)&&(s.reps||0)>(b.reps||0)))b=s;
 });
 return b;
}

/* grafiek */
function chart(punten,eenheid){
 if(!punten.length)return '<p class="muted">Nog geen gegevens.</p>';
 var W=320,H=170,pl=40,pr=12,pt=12,pb=24;
 var xs=punten.map(function(p){return new Date(p.x+'T12:00:00').getTime();}),ys=punten.map(function(p){return p.y;});
 var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs),y0=Math.min.apply(null,ys),y1=Math.max.apply(null,ys);
 if(x0===x1){x0-=864e5;x1+=864e5;}
 if(y0===y1){y0-=1;y1+=1;}
 var pad=(y1-y0)*0.12;y0-=pad;y1+=pad;
 function X(t){return pl+(t-x0)/(x1-x0)*(W-pl-pr);}
 function Y(v){return pt+(1-(v-y0)/(y1-y0))*(H-pt-pb);}
 var pad_=punten.map(function(p,i){return(i?'L':'M')+X(xs[i]).toFixed(1)+' '+Y(p.y).toFixed(1);}).join(' ');
 var dots=punten.map(function(p,i){return '<circle cx="'+X(xs[i]).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="3.5" fill="var(--accent)"/>';}).join('');
 var ticks=[y0+pad,(y0+y1)/2,y1-pad].map(function(v){return '<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'" stroke="var(--line)"/><text x="'+(pl-4)+'" y="'+(Y(v)+4).toFixed(1)+'" font-size="10" text-anchor="end" fill="var(--muted)">'+fmt(v)+'</text>';}).join('');
 var xl='<text x="'+pl+'" y="'+(H-6)+'" font-size="10" fill="var(--muted)">'+esc(nlDatum(punten[0].x))+'</text><text x="'+(W-pr)+'" y="'+(H-6)+'" font-size="10" text-anchor="end" fill="var(--muted)">'+esc(nlDatum(punten[punten.length-1].x))+'</text>';
 return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Grafiek '+esc(eenheid)+'">'+ticks+xl+'<path d="'+pad_+'" fill="none" stroke="var(--accent)" stroke-width="2"/>'+dots+'</svg><div class="muted">Eenheid: '+esc(eenheid)+'</div>';
}

function reeks(exId,metriek){
 var pts=[],lijst=[];
 S.trainingen.slice().sort(function(a,b){return a.datum<b.datum?-1:1;}).forEach(function(t){
  (t.items||[]).forEach(function(it){
   if(it.exId!==exId)return;
   var y=null,tekst='';
   if(t.soort==='cardio'){
    y=metriek==='afstand'?t.afstand:t.minuten;tekst=fmt(t.minuten)+' min'+(t.afstand!=null?', '+fmt(t.afstand)+' km':'');
   }else{
    var sets=it.sets||[];
    if(metriek==='kg'){var b=besteSet(sets.filter(function(s){return s.kg!=null;}));y=b?b.kg:null;}
    else if(metriek==='volume'){var v=0,ok=false;sets.forEach(function(s){if(s.kg!=null&&s.reps!=null){v+=s.kg*s.reps;ok=true;}});y=ok?v:null;}
    else{var r=0,ok2=false;sets.forEach(function(s){if(s.reps!=null){r+=s.reps;ok2=true;}});y=ok2?r:null;}
    tekst=sets.map(function(s){return setTekst(s,it.tijd);}).join(' | ');
   }
   lijst.push({x:t.datum,y:y,tekst:tekst});
   if(y!=null)pts.push({x:t.datum,y:y});
  });
 });
 return{pts:pts,lijst:lijst};
}

 return h;

 h+='<div class="card"><h3>Materiaal thuis</h3>'+MATERIAAL.map(function(m){return '<label class="chk"><input type="checkbox" '+(p.materiaal[m[0]]?'checked':'')+' onchange="A.mat(\''+m[0]+'\',this.checked)">'+m[1]+'</label>';}).join('');
 h+='<label>Gewicht van de halterstang (kg)</label><input type="text" inputmode="decimal" value="'+esc(p.halter.baar)+'" onchange="A.hl(\'baar\',this.value)"><label>Aantal halters</label><select onchange="A.hl(\'aantal\',this.value)">'+[1,2].map(function(n){return '<option'+(n===parseInt(p.halter.aantal,10)?' selected':'')+'>'+n+'</option>';}).join('')+'</select><label>Schijven (aantal x kg, gescheiden door puntkomma)</label><textarea rows="2" placeholder="bv. 4x1,25; 4x2,5; 4x5" onchange="A.hl(\'schijven\',this.value)">'+esc(p.halter.schijven)+'</textarea>';
 var g=halterGewichten();
 h+='<p class="muted">Mogelijke gewichten per halter: '+(g.length>1?g.map(fmt).join(', ')+' kg':'vul de schijven in')+'.</p></div>';
 h+='<div class="card"><h3>Back-up</h3><p class="muted">Gegevens staan in deze browser op dit toestel. Maak regelmatig een back-up.</p><button class="btn" onclick="A.exp()">Back-up exporteren</button><label class="btn alt" style="display:inline-block;cursor:pointer">Back-up importeren<input type="file" accept="application/json,.json" style="display:none" onchange="A.imp(this)"></label><button class="btn rood" onclick="A.reset()">Alles wissen</button></div>';
 return h;
}
function vHulp(){
 return '<h2>Handleiding</h2>'+
 '<details open><summary>Beginnen in 5 stappen</summary>'+
 '<p><b>1. Profiel invullen.</b> Vul je lengte in, kies je doelen, vink eventuele blessures aan en duid het materiaal aan dat je thuis hebt. Bij halters vul je het gewicht van de stang en de schijven in.</p>'+
 '<p><b>2. Schema bekijken.</b> Onder Schema zie je je week: dagen in Jan Palfijn, thuistrainingen en rustdagen.</p>'+
 '<p><b>3. Trainen en noteren.</b> Druk bij een trainingsdag op Training loggen en vul na elke set je herhalingen en gewicht in. Sla op als je klaar bent.</p>'+
 '<p><b>4. Meten.</b> Noteer onder Metingen af en toe je gewicht en taille (en eventueel vetpercentage). De BMI rekent de app zelf uit.</p>'+
 '<p><b>5. Back-up maken.</b> Je gegevens staan alleen in de browser op dit toestel. Maak onder Profiel regelmatig een back-up.</p></details>'+
 '<details><summary>Schema</summary>'+
 '<p>Toont je week. Op krachtdagen krijg je een opwarming, oefeningen met sets en herhalingen en stretchoefeningen op het einde. De oefeningen wisselen af tussen spiergroepen, zodat dezelfde spier niet meerdere keren na elkaar aan bod komt. Bij een cardiodag krijg je een cardio-oefening met een duur.</p>'+
 '<p>Naast een oefening staat na de eerste training "vorige keer", met wat je toen deed. Gebruik dat als richtlijn voor deze keer.</p>'+
 '<p>De knop Nieuw schema maakt een andere keuze van oefeningen. Ook wijzigt het schema vanzelf elke week. Met Afdrukken krijg je een papieren versie.</p>'+
 '<p>Verander je een blessure, het materiaal of de dagen in je profiel, dan past het schema zich daaraan aan.</p></details>'+
 '<details><summary>Training</summary>'+
 '<p>Kies een geplande dag, een vrije krachttraining, vrije cardio of een Jan Palfijn-sessie. Bij kracht vul je per set de herhalingen en het gewicht in. Bij een oefening zoals de plank vul je seconden in. Met + set voeg je een set toe en met Oefening toevoegen onderaan een extra oefening.</p>'+
 '<p>De gewichten voor je halters staan als suggestie klaar, op basis van de schijven in je profiel. Je mag ook zelf een getal typen.</p>'+
 '<p>Bij cardio noteer je de minuten en eventueel de afstand. Druk onderaan op Training opslaan om het te bewaren.</p></details>'+
 '<details><summary>Voortgang</summary>'+
 '<p>Kies een oefening en wat je wil volgen: het zwaarste gewicht, het totale volume (gewicht x herhalingen) of de herhalingen. Je ziet een grafiek en een tabel met het verschil ten opzichte van de vorige keer. Groen is vooruitgang. Onderaan staan al je trainingen, waar je een foute training kan verwijderen.</p></details>'+
 '<details><summary>Metingen</summary>'+
 '<p>Vul datum, gewicht, taille en eventueel vetpercentage in. Voor de BMI heb je je lengte in het profiel nodig. Meet het liefst op hetzelfde moment, bijvoorbeeld elke zaterdagochtend nuchter.</p>'+
 '<p>De BMI maakt geen onderscheid tussen vet en spieren. Taille en vetpercentage geven daarom een beter beeld als je spieren opbouwt en vet verliest.</p></details>'+
 '<details><summary>Oefeningen</summary>'+
 '<p>De lijst met alle oefeningen en een korte uitleg. Met het vinkje zet je een oefening aan of uit: een oefening die uitstaat wordt nooit gepland. Onderaan voeg je zelf oefeningen toe. Die krijgen een * zodat je ziet dat ze nieuw zijn. Geef bij nieuwe oefeningen ook aan bij welke blessure ze niet geschikt zijn.</p></details>'+
 '<details><summary>Profiel</summary>'+
 '<p><b>Blessures:</b> vink aan wat pijn doet. Oefeningen die dat belasten worden niet meer gepland. Is een blessure genezen of komt er een bij, pas het dan hier aan.</p>'+
 '<p><b>Weekindeling:</b> kies je dagen in Jan Palfijn en het aantal thuistrainingen. Laat je Vaste thuisdagen leeg, dan kiest de app zelf goed verspreide dagen.</p>'+
 '<p><b>Halters:</b> vul het gewicht van de stang in, het aantal halters en je schijven, bijvoorbeeld 4x1,25; 4x2,5; 4x5. De app toont welke gewichten mogelijk zijn.</p>'+
 '<p><b>Back-up:</b> exporteer een bestand en bewaar het op een veilige plek. Met importeren zet je het later terug, bijvoorbeeld op een nieuw toestel.</p></details>'+
 '<details><summary>Handige tips</summary>'+
 '<p>Zet de pagina op je beginscherm via het deelmenu van je browser, zodat hij aanvoelt als een echte app.</p>'+
 '<p>Wis je de browsergegevens of gebruik je een ander toestel, dan zijn je gegevens daar niet aanwezig. Zonder back-up ben je ze kwijt.</p>'+
 '<p>Dit zijn algemene trainingssuggesties en geen medisch advies. Bij klachten overleg je eerst met een arts of kinesitherapeut.</p></details>';
}
var VIEWS={schema:vSchema,training:vTraining,voortgang:vVoortgang,metingen:vMetingen,oefeningen:vOefeningen,profiel:vProfiel,hulp:vHulp};

function render(){
 var v=document.getElementById('view'),n=document.getElementById('nav');
 v.innerHTML=VIEWS[tab]();
 n.innerHTML=TABS.map(function(t){return '<button class="'+(t[0]===tab?'on':'')+'" onclick="A.go(\''+t[0]+'\')">'+t[1]+'</button>';}).join('');
 var hl=document.getElementById('hello');if(hl)hl.textContent=S.profiel.naam||'';
}
function go(t){tab=t;render();window.scrollTo(0,0);}

var A={
 go:go,
 nieuw:function(){S.seed++;bewaar();render();},
 start:function(d){var x=plan().filter(function(y){return y.d===d;})[0];if(!x||!x.training)return;L=nieuwLog(x.training.type,d,x.training);tab='training';render();window.scrollTo(0,0);},
 startJp:function(){L=nieuwLog('jp',null,null);L.label='';tab='training';render();window.scrollTo(0,0);},
 vrij:function(soort){L=nieuwLog(soort,null,null);if(soort==='cardio'){var c=alle().filter(function(e){return e.type==='cardio'&&toegestaan(e);})[0]||alle().filter(function(e){return e.type==='cardio';})[0];L.items=[{exId:c.id,naam:c.naam,sets:[]}];L.minuten=String(S.profiel.cardioMin||30);}render();},
 lg:function(k,v){L[k]=v;},
 st:function(i,j,k,v){L.items[i].sets[j][k]=v;},
 addSet:function(i){L.items[i].sets.push({reps:'',kg:''});render();},
 delOef:function(i){L.items.splice(i,1);render();},
 addOef:function(){var id=document.getElementById('addOef').value,e=exById(id);if(!e)return;var la=laatsteVoor(id);L.items.push({exId:id,naam:e.naam,tijd:!!e.tijd,doel:'',laatste:la?setTekst(la,e.tijd):'',sets:[{reps:'',kg:''},{reps:'',kg:''},{reps:'',kg:''}]});render();},
 cardioKies:function(id){var e=exById(id);L.items=[{exId:id,naam:e.naam,sets:[]}];},
 annuleer:function(){L=null;render();},
 bewaarTraining:function(){
  var t={id:Date.now(),datum:L.datum||vandaag(),soort:L.soort,items:[],notitie:L.notitie||''};
  if(L.soort==='kracht'){
   L.items.forEach(function(it){
    var sets=it.sets.map(function(s){return{reps:num(s.reps),kg:num(s.kg)};}).filter(function(s){return s.reps!=null||s.kg!=null;});
    if(sets.length)t.items.push({exId:it.exId,naam:it.naam,tijd:!!it.tijd,sets:sets});
   });
   if(!t.items.length){alert('Vul minstens één set in.');return;}
  }else if(L.soort==='cardio'){
   t.items=L.items.map(function(it){return{exId:it.exId,naam:it.naam,sets:[]};});
   t.minuten=num(L.minuten);t.afstand=num(L.afstand);
   if(t.minuten==null){alert('Vul de duur in.');return;}
  }
  S.trainingen.push(t);bewaar();L=null;tab='voortgang';render();window.scrollTo(0,0);
 },
 delTraining:function(id){if(!confirm('Deze training verwijderen?'))return;S.trainingen=S.trainingen.filter(function(t){return t.id!==id;});bewaar();render();},
 vEx:function(v){voortExId=v;render();},
 vMet:function(v){voortMetriek=v;render();},
 mMet:function(v){metMetriek=v;render();},
 meting:function(){
  var g=num(document.getElementById('mGew').value),t=num(document.getElementById('mTaille').value),v=num(document.getElementById('mVet').value),d=document.getElementById('mDatum').value||vandaag();
  if(g==null&&t==null&&v==null){alert('Vul minstens één waarde in.');return;}
  S.metingen.push({id:Date.now(),datum:d,gewicht:g,taille:t,vet:v});bewaar();render();
 },
 delMeting:function(id){if(!confirm('Deze meting verwijderen?'))return;S.metingen=S.metingen.filter(function(m){return m.id!==id;});bewaar();render();},
 filter:function(f){oefFilter=f;render();},
 gebruik:function(id,aan){var i=S.uit.indexOf(id);if(aan&&i>=0)S.uit.splice(i,1);if(!aan&&i<0)S.uit.push(id);bewaar();},
 delEigen:function(id){if(!confirm('Deze oefening verwijderen?'))return;S.eigen=S.eigen.filter(function(e){return e.id!==id;});bewaar();render();},
 voegToe:function(){
  var naam=document.getElementById('oNaam').value.trim();
  if(!naam){alert('Geef de oefening een naam.');return;}
  function vals(n){return Array.prototype.map.call(document.querySelectorAll('input[name='+n+']:checked'),function(x){return x.value;});}
  var type=document.getElementById('oType').value;
  var e=E('eigen_'+Date.now(),naam,type,document.getElementById('oGroep').value,vals('oMat'),vals('oUit'),document.getElementById('oUitleg').value.trim(),{nieuw:true});
  S.eigen.push(e);bewaar();render();
 },
 pf:function(k,v){S.profiel[k]=v;bewaar();},
 doel:function(k,v){S.profiel.doelen[k]=v;bewaar();},
 mat:function(k,v){S.profiel.materiaal[k]=v;bewaar();},
 hl:function(k,v){S.profiel.halter[k]=v;bewaar();render();},
 tg:function(key,val,on){
  var a=S.profiel[key],i=a.indexOf(val);
  if(on&&i<0)a.push(val);if(!on&&i>=0)a.splice(i,1);
  bewaar();
 },
 exp:function(){
  S.laatsteExport=vandaag();bewaar();
  var b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='fysio-fit-backup-'+vandaag()+'.json';document.body.appendChild(a);a.click();a.remove();
 },
 imp:function(inp){
  var f=inp.files&&inp.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
   try{
    var d=JSON.parse(r.result);if(!d||typeof d!=='object'||!d.profiel)throw new Error('ongeldig');
    if(!confirm('De huidige gegevens vervangen door deze back-up?'))return;
    localStorage.setItem(KEY,JSON.stringify(d));S=laad();opslagOk=true;bewaar();render();
   }catch(e){alert('Dit bestand is geen geldige back-up.');}
  };
  r.readAsText(f);
 },
 reset:function(){if(confirm('Alle gegevens wissen? Dit kan niet ongedaan gemaakt worden.')&&confirm('Zeker? Maak eerst een back-up als je die nog wil.')){S=standaard();try{localStorage.removeItem(KEY);}catch(e){}L=null;render();}}
};
window.A=A;
render();
})();
</script>
</body>
